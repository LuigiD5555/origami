name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Gatekeeper policy coherence
        run: bash tests/test-gatekeeper.sh
      - name: Formal contract coherence
        run: bash tests/test-formal-contracts.sh
      - name: Claims ledger coherence
        run: bash tests/test-claims.sh
      - name: Temporal contract coherence
        run: bash tests/test-temporal-contracts.sh
      - name: Candidate builder coherence
        run: bash tests/test-candidate-builder.sh
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build CLIs
        run: |
          go build ./cmd/ohf-lab
          go build ./cmd/ohf-glyphcalc
          go build ./cmd/origami-reference
          go build ./cmd/origami-evidence-gate
          go build ./cmd/origami-reduce
          go build ./cmd/origami-ingest
          go build ./cmd/origami-system
          go build ./cmd/origami-perception-eval
          go build ./cmd/origami-write-plan
          go build ./cmd/origami-automaton
          go build ./cmd/origami-temporal
          go build ./cmd/origami-temporal-carrier
          go build ./cmd/origami-candidate-build
          go build ./cmd/origami-r3-cell-identity
          go build ./cmd/origami-r4-from-state
          go build ./cmd/origami-r5-rule-role-binding
          go build ./cmd/origami-r6-execution-compliance
          go build ./cmd/origami-r7-synchronous-fidelity
      - name: Build R3 cell identity specimen
        run: go run ./cmd/origami-r3-cell-identity -out evidence/r3-cell-identity
      - name: Upload R3 cell identity specimen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: R3-cell-identity-redundancy-r1
          path: evidence/r3-cell-identity/
          if-no-files-found: error
          retention-days: 30
      - name: Build R4 from-state specimen
        run: go run ./cmd/origami-r4-from-state -out evidence/r4-from-state
      - name: Upload R4 from-state specimen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: R4-from-state-precondition-visible-r1
          path: evidence/r4-from-state/
          if-no-files-found: error
          retention-days: 30
      - name: Build R5 unseen-rule role-binding specimen
        run: go run ./cmd/origami-r5-rule-role-binding -out evidence/r5-rule-role-binding
      - name: Upload R5 unseen-rule role-binding specimen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: R5-rule-role-binding-unseen-rules-r1
          path: evidence/r5-rule-role-binding/
          if-no-files-found: error
          retention-days: 30
      - name: Build R6 cross-model execution compliance specimen
        run: go run ./cmd/origami-r6-execution-compliance -out evidence/r6-execution-compliance
      - name: Upload R6 cross-model execution compliance specimen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: R6-execution-policy-compliance-cross-model-r1
          path: evidence/r6-execution-compliance/
          if-no-files-found: error
          retention-days: 30
      - name: Build R7 synchronous execution fidelity specimen
        run: go run ./cmd/origami-r7-synchronous-fidelity -out evidence/r7-synchronous-fidelity
      - name: Upload R7 synchronous execution fidelity specimen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: R7-synchronous-execution-fidelity-cross-model-r1
          path: evidence/r7-synchronous-fidelity/
          if-no-files-found: error
          retention-days: 30
      - name: Run temporal automaton reference
        run: bash tests/test-temporal-reference.sh
      - name: Run deterministic reference experiment
        run: |
          mkdir -p evidence
          go run ./cmd/origami-reference \
            --experiment experiments/EXP-001-relational-state/experiment.json \
            --out evidence/EXP-001-reference.json
          go run ./cmd/origami-evidence-gate \
            --experiment experiments/EXP-001-relational-state/experiment.json \
            --evidence evidence/EXP-001-reference.json
      - name: Upload reference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EXP-001-reference-evidence
          path: evidence/EXP-001-reference.json
          if-no-files-found: error
          retention-days: 30
      - name: Installer prerequisite check
        run: ./install.sh --check-only
      - name: Dimensional DVR/PSS gates
        run: ./scripts/dimensional_inspect.sh
      - name: Reversible install/uninstall roundtrip
        run: ./scripts/test_install_uninstall_roundtrip.sh
